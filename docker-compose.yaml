version: '3.7'

services:
  postgresql:
    build: docker/postgresql
    volumes:
      - postgresql_bazafirm:/var/lib/postgresql/data/
    environment:
      POSTGRES_DB: bazafirm
      POSTGRES_USER: bazafirm
      POSTGRES_PASSWORD: bazafirm
    ports:
      - "25432:5432"

volumes:
  postgresql_bazafirm:
