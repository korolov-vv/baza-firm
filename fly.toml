app = 'baza-firm-be'
primary_region = 'fra'

kill_signal = 'SIGTERM'
kill_timeout = '5m0s'

[build]

[http_service]
  internal_port = 8080
  force_https = true
  auto_start_machines = true
  processes = ['app']

  [[http_service.checks]]
    interval = '30s'
    timeout = '5s'
    grace_period = '20s'
    method = 'GET'
    path = '/actuator/health'

[[vm]]
  size = 'performance-1x'
