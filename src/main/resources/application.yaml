server:
  port: 8080

spring:
  application:
    name: firms
    profiles:
      active: ${DEPLOY_ENV}
  datasource:
    url: ${POSTGRESQL_DB_URL}
    username: ${POSTGRESQL_DB_USERNAME}
    password: ${POSTGRESQL_DB_PASSWORD}
  jpa:
    database: postgresql
    hibernate:
      ddl-auto: none
  liquibase:
    change-log: classpath:db/changelog/baza-firmy-changelog.yaml
  quartz:
    job-store-type: jdbc
    properties:
      org.quartz.scheduler.instanceName: BAZA_FIRM_SCHEDULER
      org.quartz.threadPool.threadCount: 2
      org.quartz.scheduler.instanceId: AUTO
      org.quartz.jobStore.isClustered: false
      org.quartz.jobStore.driverDelegateClass: org.quartz.impl.jdbcjobstore.PostgreSQLDelegate

aws:
  access-key: ${AWS_ACCESS_KEY}
  secret-key: ${AWS_SECRET_KEY}
  endpoint: ${AWS_SERVICE_ENDPOINT}
  temp-dir-path: ${TEMP_DIR_PATH}

ceidg:
  ceidg-path: ${CEIDG_PATH}
  token: ${CEIDG_TOKEN}

smtp:
    host: ${SMTP_HOST}
    port: ${SMTP_PORT:587}
    username: ${SMTP_USERNAME}
    password: ${SMTP_PASSWORD}
